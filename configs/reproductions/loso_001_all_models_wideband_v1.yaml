protocol_id: loso_001_all_models_wideband_v1
source:
  directory: /data1/llx/BNCI2014001/broadband_0p1_75hz
  native_sampling_rate_hz: 250
  source_filter_hz: [0.1, 75.0]
  selected_session: 0train
  legacy_session: session_T
  model_window_samples: 1000
  shared_trial_manifests: /data1/llx/BigSmallcollab/cache/eegfm_alignment_v2/model_inputs/wideband_npy_v3
tasks:
  BNCI2014001:
    classes: {left_hand: 0, right_hand: 1}
    trials: 1296
    trials_per_subject: 144
    train_per_fold: 1152
    test_per_fold: 144
  BNCI2014001-4:
    classes: {left_hand: 0, right_hand: 1, feet: 2, tongue: 3}
    trials: 2592
    trials_per_subject: 288
    train_per_fold: 2304
    test_per_fold: 288
models:
  ifnet:
    parameter_source: configs/models/ifnet.yaml::finetune.BNCI2014001*.loso
    initialization: random_from_scratch_each_fold_seed
    optimizer: AdamW
    learning_rate: 0.001
    batch_size: 16
    weight_decay: 0.01
    epochs: 100
    preprocessing: adapter_filterbank_4_16_hz_and_16_40_hz_from_broadband_source
  eegnet:
    parameter_source: configs/models/eegnet.yaml::finetune.BNCI2014001*.loso
    initialization: random_from_scratch_each_fold_seed
    optimizer: AdamW
    learning_rate: 0.001
    batch_size: 32
    weight_decay: 0.0001
    epochs: 100
    preprocessing: epoch_bandpass_8_32_hz_order4_zero_phase
  adfcnn:
    parameter_source: configs/models/adfcnn.yaml::finetune.BNCI2014001*.loso
    initialization: random_from_scratch_each_fold_seed
    optimizer: AdamW
    learning_rate: 0.001
    batch_size: 32
    weight_decay: 0.0001
    epochs: 100
    preprocessing: epoch_bandpass_8_32_hz_order4_zero_phase
evaluation:
  split: leave_one_subject_out
  subjects: 9
  seeds: [0, 1, 2]
  validation: none
  test_evaluation: once_after_fixed_final_epoch
  task_trial_order_and_labels: reuse_completed_wideband_npy_v3_trial_manifests
execution:
  allowed_gpus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  prohibited_gpus: [0]
  max_concurrent_workers: 6
  minimum_free_memory_mib: 10000
  maximum_gpu_utilization_percent: 40
  result_directory: /data1/llx/BigSmallcollab/results/reproductions/loso_config_alignment_v2/wideband_npy_v3
