main_recipes:
  mirepnet:
    name: project_loso_mi8_30_subject_ea_idw45
    parameter_source: configs/models/mirepnet.yaml::finetune.<dataset>.loso
    optimizer: adam
    lr: 0.001
    batch_size: 8
    weight_decay: 0.000001
    label_smoothing: 0.0
    epochs: {BNCI2014001: 10, BNCI2014001-4: 20, BNCI2014004: 10, BNCI2015001: 10, AlexMI: 10}
    trainable_scope: all_parameters
    lr_schedule: cosine_annealing_per_epoch
    warmup_epochs: 0
    min_lr: 0.0
    preprocessing:
      order: [canonical_window, bandpass_8_30, per_subject_ea, idw_45_channels]
      bandpass: {implementation: data.preproc.bandpass, order: 4, zero_phase: true, low_hz: 8, high_hz: 30}
      ea_training: separately_for_each_source_subject
      ea_test: entire_unlabeled_held_out_subject_pool
      evaluation_regime: transductive_loso
      channel_mapping: inverse_distance_using_data_channels_artificial_2d_positions
      channel_mapping_implementation: data.preproc.pad_missing_channels_diff
      input_shape: [B, 45, 1000]
      adapter_skip_preprocess: true
  cbramod:
    name: project_loso_filtered_native4s_flatten
    parameter_source: configs/models/cbramod.yaml::finetune.<dataset>.loso
    preprocessing_source: explicit_protocol_override_matching_completed_004_runner
    optimizer: adamw
    optimizer_eps: 1.0e-8
    lr: 0.0001
    batch_size: 64
    weight_decay: 0.05
    dropout: 0.1
    label_smoothing: 0.1
    epochs: 50
    trainable_scope: all_parameters
    lr_schedule: cosine_annealing_per_epoch
    warmup_epochs: 0
    min_lr: 0.0
    head: flatten_dropout_linear
    preprocessing:
      order: [canonical_window, resample_to_200, bandpass_0_3_75, notch_60, native_channel_patchify]
      target_fs_hz: 200
      bandpass: {implementation: data.preproc.bandpass, order: 4, zero_phase: true, low_hz: 0.3, high_hz: 75}
      notch: {implementation: data.preproc.notch, frequency_hz: 60, Q: 30, zero_phase: true}
      apply_EA: false
      norm_method: null
      scale: 1.0
      input_shape: [B, C_native, 4, 200]

