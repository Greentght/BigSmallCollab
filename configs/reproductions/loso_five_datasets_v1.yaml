# Experiment specification. This file is a plan; the existing YAML experiment
# dispatcher does not yet consume this schema.
spec_version: 1
kind: loso_reproduction_plan
protocol_id: loso_five_settings_canonical4s_v1
created: '2026-10-01'
status: planned
execution:
  runner_status: implemented_preflight_passed_formal_execution_started
  output_template: results/reproductions/loso_five_settings_canonical4s_v1/{dataset}/{model}/{recipe}/subject_{subject:02d}/seed_{seed}
  trial_manifest: configs/reproductions/manifests/loso_five_datasets_v1_trials.csv
  source_snapshot: configs/reproductions/manifests/loso_five_datasets_v1_sources.json
  fold_manifest: docs/loso_five_datasets_folds.csv

protocol:
  seeds: [666, 667, 668]
  split: leave_one_subject_out
  train_scope: all_selected_trials_of_other_subjects
  test_scope: all_selected_trials_of_held_out_subject
  split_rng: none
  validation: none_for_fixed_recipe_baseline
  selection: fixed_final_epoch
  test_evaluation: once_after_training
  target_label_calibration: false
  initialization: same_pretrained_checkpoint_fresh_for_each_fold_seed
  scope: frozen_current_cache_reproduction
  provenance_policy: record_unknown_unit_filter_and_epoch_origin_fields_as_unknown
  source_uid: [source_dataset, raw_cache_row]
  legacy_uid: [zero_based_subject, selected_trial_within_subject]
  subject_sampling: uniform_trial_shuffle_without_subject_balancing

