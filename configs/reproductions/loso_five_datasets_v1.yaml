workload:
  outer_task_folds: 47
  main_models: 2
  main_seeds: 3
  main_fold_seed_cells: 282
  completed_main_004_cells_eligible_for_conditional_reuse: 54
  remaining_main_cells_if_004_reused: 228
  optional_cbramod_reference_cells: 117
  main_plus_optional_cells: 399
  remaining_main_plus_optional_if_004_reused: 345

reuse:
  condition: same_source_hashes_trial_order_pretrained_hashes_preprocessing_training_schedule_and_head
  legacy_record_policy: preserve_existing_004_evidence_and_flag_missing_train_history_or_historical_environment_without_fabrication
  completed_main_004:
    root: results/reproductions/loso_benchmark_session3_4s_v1
    models: [mirepnet, cbramod]
    seeds: [666, 667, 668]
    cells: 54
  historical_004_reference:
    root: results/reproductions/loso_eegfm_cbfull_session3_4s_v1
    model: cbramod
    seeds: [0, 1, 2]
    cells: 27
    use: historical_unpaired_sensitivity_result
  cache_rebuild_policy: new_protocol_version_and_rerun_004_if_source_or_transform_changes

reporting:
  primary_metrics: [accuracy, balanced_accuracy, cohen_kappa]
  additional_metrics: [macro_f1, confusion_matrix]
  optional_auroc:
    binary: positive_class_1
    multiclass: macro_one_vs_rest_probabilities
  primary_aggregation: equal_subject_mean_per_seed_then_mean_and_sample_std_across_seeds
  paired_model_comparison: same_dataset_subject_and_seed
  optional_significance_unit: subject_after_averaging_seeds_within_subject
  dataset_pooling: no_independent_sample_claim_for_001_and_001_4_overlap
  artifact_requirements_scope: newly_trained_cells_with_explicit_legacy_exceptions_for_imported_004
  artifact_requirements:
    - source_and_code_and_environment_snapshot
    - resolved_model_config
    - train_and_test_subjects_and_source_uids
    - pretrained_checkpoint_sha256
    - train_history_with_actual_learning_rates
    - final_checkpoint
    - test_labels_predictions_logits_probabilities_and_features
    - test_metrics_and_summary_csv_json
  resume_requirement: validate_completed_cell_manifest_before_skip_and_summarize_all_manifest_seeds

memory_fallback:
  trigger: documented_out_of_memory_during_batch_size_preflight
  policy: separately_recorded_microbatch_and_gradient_accumulation_implementation_version
  loss_weighting: actual_samples_in_each_effective_batch_including_the_last_partial_batch
  optimizer_and_step_lr_updates: once_per_effective_batch
  numerical_equivalence: not_guaranteed_due_to_dropout_rng_order_and_floating_point_accumulation

future_tuning:
  policy: only_source_subject_validation_inside_each_outer_fold
  training_subjects: 7_of_8_for_9_subject_datasets_10_of_11_for_12_subject_dataset_6_of_7_for_8_subject_dataset
  validation_subjects: one_source_subject_or_inner_subject_loso
  final_training: fresh_initialization_on_all_outer_source_subjects_after_selection
  reporting: separate_nested_tuned_recipe_from_fixed_recipe_baseline
