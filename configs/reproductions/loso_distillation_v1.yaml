# Four ordered LOSO distillation stages on the frozen five-setting protocol.
# Distillation warmup is CE-only training; it does not warm up the learning rate.
spec_version: 1
protocol_id: loso_five_settings_kd_feature_warmup10_v1
source_protocol: loso_five_settings_canonical4s_v1
datasets: [BNCI2014001, BNCI2014001-4, BNCI2014004, BNCI2015001, AlexMI]
seeds: [666, 667, 668]

teachers:
  mirepnet:
    default_recipe: project_loso_mi8_30_subject_ea_idw45
  cbramod:
    default_recipe: eegfm_full_recipe_transferred_to_loso4s
    recipe_overrides:
      AlexMI: project_loso_filtered_native4s_flatten
students: [ifnet, eegnet, adfcnn]

loss:
  ce_weight: 1.0
  temperature: 2.0
  feature_metric: cosine
  feature_transform: native_penultimate
  teacher_correct_mask: false

stages:
  logits_kd:
    lam_kd: 0.5
    lam_feat: 0.0
    distill_warmup_epochs: 0
  kd_feature:
    lam_kd: 0.5
    lam_feat: 0.5
    distill_warmup_epochs: 0
  warmup10_kd:
    lam_kd: 0.5
    lam_feat: 0.0
    distill_warmup_epochs: 10
  warmup10_kd_feature:
    lam_kd: 0.5
    lam_feat: 0.5
    distill_warmup_epochs: 10

student_training:
  parameter_source: completed_small_loso_baseline_manifest
  epochs: 100
  lr_schedule: cosine_per_epoch
  initialization: fresh_random_paired_seed
  optimizer: adamw
  lr: 0.001
  batch_size: {ifnet: 16, eegnet: 32, adfcnn: 32}
  weight_decay: {ifnet: 0.01, eegnet: 0.0001, adfcnn: 0.0001}

output_root: /data1/llx/BigSmallCollab_results/distill/loso_five_settings_kd_feature_warmup10_v1
execution:
  runner: experiments/distill/run_loso_distillation.py
  launcher: experiments/distill/run_loso_distillation_suite.sh
  stage_order: [logits_kd, kd_feature, warmup10_kd, warmup10_kd_feature]
  checkpoint_every_epochs: 5
  teacher_cache: source_training_uids_only
  fail_fast: true
  torch_num_threads: 4

protocol:
  split: leave_one_subject_out
  trial_manifest: configs/reproductions/manifests/loso_five_datasets_v1_trials.csv
  source_snapshot: configs/reproductions/manifests/loso_five_datasets_v1_sources.json
  fold_manifest: docs/loso_five_datasets_folds.csv
  final_epoch_evaluation: 100
  validation: none_for_fixed_recipe
  target_label_calibration: false
  target_distribution_adaptation_for_student: false
  teacher_training_targets: in_sample_source_subject_trials
  teacher_mode: frozen_eval
  baseline_recipe: scratch_supervised_loso_v1
  paired_initialization: identical_student_state_before_projector_creation
  paired_batch_order: baseline_seeded_dataloader_generator
  mi_teacher_historical_evaluation: transductive_label_free_test_ea

feature_alignment:
  teacher_feature: native_penultimate_before_dropout_and_classifier
  student_feature: adapter_native_penultimate
  projector: linear_student_dim_to_teacher_dim
  projector_training: alongside_student_on_source_training_trials
  projector_inference: discarded
  teacher_feature_dimensions:
    mirepnet: {BNCI2014001: 256, BNCI2014001-4: 256, BNCI2014004: 256, BNCI2015001: 256, AlexMI: 256}
    cbramod: {BNCI2014001: 17600, BNCI2014001-4: 17600, BNCI2014004: 2400, BNCI2015001: 10400, AlexMI: 12800}

workload:
  dataset_folds: 47
  teacher_student_pairs: 6
  teacher_cache_units: 282
  stages: 4
  training_units_per_stage: 846
  total_distillation_training_units: 3384
