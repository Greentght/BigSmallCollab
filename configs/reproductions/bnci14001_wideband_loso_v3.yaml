selection:
  loso_session: 0train
  equivalent_legacy_session: session_T
  source_window: first_1000_native_samples_before_model_resampling
  physical_trial_uids: shared_between_models_and_class_subsets
  tasks:
    BNCI2014001:
      classes: {left_hand: 0, right_hand: 1}
      selected_trials: 1296
