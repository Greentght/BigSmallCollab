  training_worker: experiments/finetune/run_loso_config_alignment.py
  allowed_gpus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  prohibited_gpus: [0]
  max_concurrent_workers: 6
  minimum_free_memory_mib: 10000
  maximum_gpu_utilization_percent: 40
