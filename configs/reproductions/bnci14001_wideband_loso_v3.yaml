      train_trials_per_fold: 1152
    BNCI2014001-4:
      classes: {left_hand: 0, right_hand: 1, feet: 2, tongue: 3}
      selected_trials: 2592
      test_trials_per_fold: 288
      train_trials_per_fold: 2304
models:
  mirepnet:
    python_env: mirepnet
    parameter_source: configs/models/mirepnet.yaml
    preprocessing:
      bandpass_hz: [8, 30]
      filter_stage: epoch_from_broadband_source
      filter_type: order4_Butterworth_filtfilt
