    training:
      optimizer: adam
      lr: 0.001
      weight_decay: 0.000001
      batch_size: 8
      epochs: {BNCI2014001: 10, BNCI2014001-4: 20}
      dropout: native_architecture_0.5
      label_smoothing: 0
      scheduler: cosine_each_epoch
      min_lr: 0
  cbramod:
    python_env: cbramod
    parameter_source: configs/reproductions/loso_config_alignment_v2.yaml
    binary_parameter_note: four_class_reference_recipe_transferred_to_binary
    preprocessing:
      resampling: MNE_250_to_200_hz
      duration_seconds: 4
      bandpass_hz: [0.3, 75]
      notch_hz: 60
      normalization: CAR
      ea: false
      input_shape: [22, 4, 200]
    training:
      optimizer: adamw
      lr: 0.001
      weight_decay: 0.1
      batch_size: 16
      epochs: 20
      head_dropout: 0.5
      label_smoothing: 0
      warmup_epochs: 5
      min_lr: 0.000001
      scheduler: reference_step_table_updated_at_epoch_end
evaluation:
  protocol: leave_one_subject_out
  seeds: [0, 1, 2]
  folds_per_task_seed: 9
  total_formal_units: 108
  fresh_pretrained_initialization_per_fold: true
  test_evaluation: final_epoch_only
  selection_using_outer_test: false
  rng_note: seed_stream_with_reference_model_build_and_test_iterator_draws
  older_666_667_668_runs: not_paired_seed_controls
execution:
