name: task_feature_logit_kd_six_pairs_seed666
type: distill
method: task_feature_logit_kd_six_pairs

datasets:
  - BNCI2014001
  - BNCI2014004
  - BNCI2015001
  - AlexMI
protocol: fewshot
val_split: 0.7
seed: 666

teachers:
  - mirepnet
  - cbramod
students:
  - ifnet
  - eegnet
  - adfcnn

output_dir: /data1/llx/BigSmallcollab/results/distill/task_feature_logit_kd_six_pairs_seed666
artifact_root: /data1/llx/BigSmallcollab/results/artifacts

epochs: 100
warmup_epochs: 10
optimizer: native_student_config
scheduler: CosineAnnealingLR
temperature_kd: 2.0
lam_kd: 0.5
lam_feature: 1.0
feature_eps: 1.0e-8
drop_last: false
model_selection: final_epoch

conditions:
  - BASE_CE
  - DELAYED_LOGIT_KD
  - TASK_FEAT_LOGIT_KD
