# CBraMod channel-wise feature alignment rerun.
# Few-shot retrains all five student arms on the broadband task sources.
# LOSO reuses CE/KD/warmup-KD references and trains only the two new feature arms.
name: cbramod_channel_feature_alignment_v1
run_id_prefix: cbramod_channel_feature_alignment
teacher: cbramod
students: [ifnet, eegnet, adfcnn]
datasets: [BNCI2014004, BNCI2014001, BNCI2014001-4, BNCI2015001, AlexMI]
seeds: [666, 667, 668]

alignment:
  teacher_backbone_feature: [batch, eeg_channel, temporal_patch, 200]
  temporal_patches: 4
  temporal_patch_pool: mean
  student_feature: one_global_native_student_feature
  projector: one_shared_linear_student_dim_to_200
  loss: mean_over_batch_and_eeg_channels_of_1_minus_cosine
  projector_bias: true

fewshot:
  protocol: stratified_30_70_per_subject
  source: wide_fre_band_for_BNCI_and_current_AlexMI_loader
  train_all_arms: [ce, kd, kd_feature, warmup10_kd, warmup10_kd_feature]
  epochs: 100
  lr: 0.001
  optimizer: adamw
  scheduler: cosine_per_epoch
  batch_size: {ifnet: 16, eegnet: 32, adfcnn: 32}
  weight_decay: {ifnet: 0.01, eegnet: 0.0001, adfcnn: 0.0001}
  dataset_overrides:
    BNCI2015001:
      eegnet: {weight_decay: 0.1}
  kd:
    temperature: 2.0
    lambda: 0.5
  feature:
    lambda: 1.0
  warmup_epochs: 10
  artifact_root: /data1/llx/BigSmallcollab/results/distill/cbramod_channel_feature/fewshot
  report_root: results/fewshot/cbramod_channel_feature

loso:
  protocol: leave_one_subject_out
  reuse_arms:
    ce: scratch_supervised_loso_v1
    kd: logits_kd from loso_five_settings_kd_feature_warmup10_v1
    warmup10_kd: warmup10_kd from loso_five_settings_kd_feature_warmup10_v1
  train_arms: [kd_feature, warmup10_kd_feature]
  epochs: 100
  lr: 0.001
  optimizer: adamw
  scheduler: cosine_per_epoch
  batch_size: {ifnet: 16, eegnet: 32, adfcnn: 32}
  weight_decay: {ifnet: 0.01, eegnet: 0.0001, adfcnn: 0.0001}
  kd:
    temperature: 2.0
    lambda: 0.5
  feature:
    lambda: 0.5
  warmup_epochs: 10
  artifact_root: /data1/llx/BigSmallcollab/results/distill/cbramod_channel_feature/loso
  report_root: results/loso/cbramod_channel_feature

runtime:
  cpu_threads_per_worker: 1
  dataloader_workers: 0
  fixed_final_epoch: true
  validation: none
