name: fusion_concat_mlp
type: fusion
method: concat_mlp

datasets:
  - BNCI2014001-4
  - BNCI2014004
  - BNCI2015001
  - AlexMI

protocols: [fewshot, loso]
seeds: null
subjects: null

include_controls: true
artifact_root: /data1/llx/BigSmallcollab/results/artifacts
output_dir: /data1/llx/BigSmallcollab/results/fusion
fail_fast: false

pairs:
  - big: mirepnet
    small: ifnet
    params:
      hidden: 128
      dropout: 0.2
      epochs: 100
      lr: 0.001
      weight_decay: 0.0001
      batch_size: 32
    grid:
      hidden: [0, 64, 128]
      dropout: [0.0, 0.2, 0.5]
  - big: mirepnet
    small: eegnet
    params:
      hidden: 64
      dropout: 0.1
      epochs: 100
      lr: 0.0005
      weight_decay: 0.0001
      batch_size: 32
    grid: {}
  - big: mirepnet
    small: adfcnn
    params:
      hidden: 128
      dropout: 0.3
      epochs: 150
      lr: 0.001
      weight_decay: 0.001
      batch_size: 32
    grid: {}
  - big: cbramod
    small: ifnet
    params:
      hidden: 64
      dropout: 0.2
      epochs: 100
      lr: 0.001
      weight_decay: 0.0001
      batch_size: 16
    grid: {}
  - big: cbramod
    small: eegnet
    params:
      hidden: 128
      dropout: 0.4
      epochs: 100
      lr: 0.0005
      weight_decay: 0.001
      batch_size: 32
    grid: {}
