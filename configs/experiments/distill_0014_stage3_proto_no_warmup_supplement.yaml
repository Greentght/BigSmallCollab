name: distill_0014_stage3_proto_no_warmup_supplement
type: distill
method: kd_mi_proto_mask_pilot
datasets: [BNCI2014001-4]
protocol: fewshot
val_split: 0.7
seed: 666
teacher: mirepnet
student: ifnet
artifact_root: results/artifacts
output_dir: results/distill/bnci2014001_4_supplement/stage3_proto_no_warmup
main_csv: results/distill/bnci2014001_4_supplement/stage3_proto_no_warmup.csv
supplement_mode: true
epochs: 100
optimizer: adamw
lr: 0.001
weight_decay: 0.01
batch_size: 16
scheduler: CosineAnnealingLR
temperature_kd: 2.0
lam_kd: 0.5
temperature_mi: 1.0
lam_mi: 0.1
mi_eps: 1.0e-8
prototype_epsilon: 1.0e-12
drop_last: false
model_selection: final_epoch
conditions: [KD_PROTO, MI_PROTO, KD_MI_PROTO]
