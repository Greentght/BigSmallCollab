epochs: 100
prealign_epochs: 10
optimizer: AdamW
lr: 0.001
weight_decay: 0.01
batch_size: 16
scheduler: CosineAnnealingLR
lambda_pre: 1.0
lambda_ft: 1.0
temperature_kd: 2.0
lam_kd: 0.5
