name: distill_0014_stage4_progressive_task_feature_logit_kd_supplement
type: distill
method: progressive_task_feature_logit_kd
datasets: [BNCI2014001-4]
protocol: fewshot
val_split: 0.7
seed: 666
pre_teacher: mirepnet
ft_teacher: mirepnet
student: ifnet
artifact_root: /data1/llx/BigSmallCollab_results/artifacts
