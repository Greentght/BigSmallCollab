# LOSO distillation methods. A plain run uses KD only.
# Add methods at launch, for example: --variants kd mmd or --variants kd kd_mmd.
# --variants warmup10_kd uses 10 CE-only epochs followed by KD within the same budget.
# --variants kd_feature adds native feature cosine alignment using fixed component params.
# --variants warmup10_kd_feature enables both KD and feature loss after 10 CE-only epochs.
# Valid teacher targets are reused; missing targets are exported from the same-fold teacher.
name: distill_kd_wide_fre_band
type: distill

default_variants: [kd]

variants:
  kd:
    method: kd
    grid_components: [kd]
  warmup10_kd:
    method: warmup10_kd
  kd_feature:
    method: kd_feature
  warmup10_kd_feature:
    method: warmup10_kd_feature
  kd_masked:
    method: kd_masked
  mmd:
    method: mmd
  kd_mmd:
    method: kd_mmd

datasets:
  - BNCI2014001
  - BNCI2014001-4
  - BNCI2014004
  - BNCI2015001
  - AlexMI

protocols: [loso]
seeds: null
subjects: null

include_baseline: true
artifact_root: /data1/llx/BigSmallcollab/cache/artifact-loso
output_dir: /data1/llx/BigSmallcollab/results/loso/distill
fail_fast: false

pairs:
  - teacher: mirepnet
    student: ifnet
    components:
      kd:
        params: {temperature: 2.0, lam_kd: 0.5}
        grid:
          temperature: [1.0, 2.0, 4.0]
          lam_kd: [0.25, 0.5, 0.75]
      mmd:
        params: {lam_mmd: 0.5}
        grid: {}
      feature:
        params: {lam_feat: 0.5}
        grid: {}

  - teacher: mirepnet
    student: eegnet
    components:
      kd:
        params: {temperature: 3.0, lam_kd: 0.3}
        grid: {}
      mmd:
        params: {lam_mmd: 0.5}
        grid: {}
      feature:
        params: {lam_feat: 0.5}
        grid: {}

  - teacher: mirepnet
    student: adfcnn
    components:
      kd:
        params: {temperature: 2.0, lam_kd: 0.4}
        grid: {}
      mmd:
        params: {lam_mmd: 0.5}
        grid: {}
      feature:
        params: {lam_feat: 0.5}
        grid: {}

  - teacher: cbramod
    student: ifnet
    components:
      kd:
        params: {temperature: 1.0, lam_kd: 0.25}
        grid:
          lam_kd: [0.1, 0.25, 0.5]
      mmd:
        params: {lam_mmd: 0.5}
        grid: {}
      feature:
        params: {lam_feat: 0.5}
        grid: {}

  - teacher: cbramod
    student: eegnet
    components:
      kd:
        params: {temperature: 2.0, lam_kd: 0.2}
        grid: {}
      mmd:
        params: {lam_mmd: 0.5}
        grid: {}
      feature:
        params: {lam_feat: 0.5}
        grid: {}

  - teacher: cbramod
    student: adfcnn
    components:
      kd:
        params: {temperature: 2.0, lam_kd: 0.3}
        grid: {}
      mmd:
        params: {lam_mmd: 0.5}
        grid: {}
      feature:
        params: {lam_feat: 0.5}
        grid: {}
