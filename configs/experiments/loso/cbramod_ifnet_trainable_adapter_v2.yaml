experiment_id: CBRAMOD_IFNET_TRAINABLE_TEACHER_ADAPTER_LOSO_V2
dataset: BNCI2014004
selected_session: session_3
source_variant: wide_fre_band
seeds: [666, 667, 668]

reference_run:
  run_id_prefix: cbramod_t2s_full_feature_loso_v1_seed
  protocol_id: sample_utility_adaptive_weight_wideband_v1
  resolved_config_sha256_by_seed:
    666: 6dfe184f7f6a5ddd8b75e57e6d67c77ce4e68f1bdf4aa349d558c0240539342f
    667: 775d37f4ee707b0593270a5c25892135171790c4365b3717b900745bf0b5ffdf
    668: 1f11b668046af82a4d3bbea0012f05e5fb8258862f383e668e37c8d25e79cde2

protocol:
  folds: 9
  train_subjects: 7
  feedback_subjects: 1
  target_subjects: 1
  train_only_for_adapter_and_student: true
  feedback_is_diagnostic_only: true
  evaluate_target_after_all_seeds_train: true

teacher_source:
  run_id_prefix: cbramod_t2s_full_feature_loso_v1
  conditions: [T_CE, T_MCC]
  feature_cache: full_teacher_targets.npz
  feature_key_suffix: train_features_full
  feature_shape: [3, 4, 200]
  flattened_dimension: 2400
  frozen: true
  reuse_only: true

adapter:
  architecture: linear2400_512_gelu_linear512_512_layernorm_no_affine
  input_dimension: 2400
  hidden_dimension: 512
  output_dimension: 512
  first_linear_bias: true
  second_linear_bias: true
  activation: GELU
  layer_norm: no_affine
  layer_norm_epsilon: 1.0e-5
  initialization: pytorch_linear_default_in_independent_cpu_rng
  optimizer: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  scheduler: cosine_annealing_epoch_end
  scheduler_t_max: 100
  scheduler_eta_min: 0.0
  gradient_clip_norm: 1.0
  precision: fp32
  foreach: false
  fused: false

student:
  architecture: ifnet
  initialization: same_canonical_untrained_I_s_as_paired_baseline
  feature_dimension: 512
  auxiliary_layer_norm: no_affine
  layer_norm_epsilon: 1.0e-5
  epochs: 100
  batch_size: 16
  optimizer: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  scheduler: cosine_annealing_epoch_end
  scheduler_t_max: 100
  scheduler_eta_min: 0.0
  gradient_clip_norm: null
  precision: fp32
  foreach: false
  fused: false
  feature_weight: 0.5
  feature_start_epoch: 1
  classification_loss: cross_entropy
  logits_kd: false
  augmentation: none

conditions:
  JOINT_A_CE_FEATURE: T_CE
  JOINT_A_MCC_FEATURE: T_MCC

randomness:
  adapter_seed: sha256_of_experiment_stage_seed_fold
  student_initialization_seed: follows_source_canonical_I_s
  student_schedule_seed: follows_source_resolved_run
  paired_student_rng: reset_to_same_seed_for_both_conditions
  adapter_rng_isolated: true

diagnostics:
  epochs: [1, 10, 50, 100]
  partitions: [D_train, D_feedback]
  feedback_selection_allowed: false

report:
  primary_metric: balanced_accuracy
  also_report: [accuracy, kappa, cross_entropy]
  aggregation: mean_seeds_within_subject_then_paired_subject_summary
  bootstrap_replicates: 10000
  bootstrap_seed: 20261103
  paired_unit: target_subject
  tie_threshold_pp: 1.0e-6
  report_directory: distill/cbramod_ifnet_trainable_adapter_v2

storage:
  external_run_id_prefix: cbramod_ifnet_trainable_adapter_v2
  queue_root: results/loso/distill/queue
