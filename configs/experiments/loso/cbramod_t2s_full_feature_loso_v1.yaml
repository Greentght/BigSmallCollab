experiment_id: CBRAMOD_T2S_FULL_FEATURE_LOSO_V1
dataset: BNCI2014004
selected_session: session_3
source_variant: wide_fre_band
seeds: [666, 667, 668]

reference_run:
  run_id_prefix: cbramod_mcc_diffkd_loso_v1_seed
  protocol_id: sample_utility_adaptive_weight_wideband_v1
  resolved_config_sha256_by_seed:
    666: 6dfe184f7f6a5ddd8b75e57e6d67c77ce4e68f1bdf4aa349d558c0240539342f
    667: 775d37f4ee707b0593270a5c25892135171790c4365b3717b900745bf0b5ffdf
    668: 1f11b668046af82a4d3bbea0012f05e5fb8258862f383e668e37c8d25e79cde2

protocol:
  folds: 9
  train_subjects: 7
  feedback_subjects: 1
  target_subjects: 1
  train_only_for_teacher_adaptation_and_prior: true
  feedback_is_diagnostic_only: true
  evaluate_after_all_seeds_finish_training: true

teachers:
  historical_run_id_prefix: cbramod_mcc_diffkd_loso_v1
  restore_exact_resolved_config_per_fold: true
  compare_rebuilt_state_hash_with_historical_manifest: true
  retain_rebuilt_teacher_checkpoints: true

teacher_adaptation:
  epochs: 10
  optimizer: adam
  lr: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6
  batch_size: 8
  scheduler: none
  forward_mode: eval_with_autograd
  precision: fp32
  gradient_clip_norm: 1.0
  mcc:
    temperature: 2.0
    weight: 1.0
    entropy_epsilon: 1.0e-5
    row_denominator_epsilon: 1.0e-8

feature_space:
  teacher_native_shape: [3, 4, 200]
  teacher_flat_dimension: 2400
  student_native_dimension: 512
  teacher_projection_shape: [512, 2400]
  teacher_projection: fixed_gaussian_thin_qr_row_orthogonal
  projection_rng: sha256_of_experiment_stage_seed_fold
  auxiliary_normalization: layer_norm_no_affine_epsilon_1e-5
  layer_norm_epsilon: 1.0e-5
  feature_loss: mean_squared_error_over_batch_and_512_dimensions
  feature_weight: 0.5

diffusion:
  conditioning: none
  steps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  hidden_dimensions: 128
  time_embedding_dimensions: 32
  training_updates: 5000
  batch_size_cap: 128
  optimizer: adamw
  lr: 3.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  diagnostic_interval: 500
  ddim_timesteps: [250, 200, 150, 100, 50, 0]
  ddim_eta: 0.0

student:
  architecture: ifnet
  initialization: same_canonical_untrained_seed_state_as_paired_loso_runs
  epochs: 100
  batch_size: 16
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  scheduler: cosine_annealing_epoch_end
  scheduler_t_max: 100
  feature_weight: 0.5
  feature_start_epoch: 1
  classification_loss: cross_entropy
  logits_kd: false
  gradient_clip_norm: null
  precision: fp32
  augmentation: none

conditions: [CE_T2S_FEATURE, MCC_T2S_FEATURE, CE_T2S_DIFFKD, MCC_T2S_DIFFKD]
condition_teacher:
  CE_T2S_FEATURE: T_CE
  MCC_T2S_FEATURE: T_MCC
  CE_T2S_DIFFKD: T_CE
  MCC_T2S_DIFFKD: T_MCC

randomness:
  teacher_seed_base: 100666
  adaptation_schedule_seed_base: 101666
  prior_seed_base: 40461101
  student_dropout_seed_base: 50561101
  student_diffusion_noise_seed_base: 60661101
  student_schedule_seed: follows_run_seed
  student_initialization_seed: follows_run_seed
  paired_conditions_share_student_dropout_stream: true
  paired_diffkd_conditions_share_noise_stream: true

report:
  primary_metric: balanced_accuracy
  report_accuracy_and_balanced_accuracy_separately: true
  aggregate: equal_subject_mean_per_seed_then_equal_seed_mean
  paired_unit: subject_within_seed
  bootstrap_replicates: 10000
  bootstrap_seed: 20261101

storage:
  external_run_id_prefix: cbramod_t2s_full_feature_loso_v1_seed
  report_directory: distill/cbramod_t2s_full_feature_loso_v1
