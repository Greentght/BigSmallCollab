name: distill_mmd
type: distill
method: mmd

datasets:
  - BNCI2014001
  - BNCI2014001-4
  - BNCI2014004
  - BNCI2015001
  - AlexMI

protocols: [fewshot, loso]
seeds: null
subjects: null

include_baseline: true
artifact_root: /data1/llx/BigSmallCollab_results/artifacts
output_dir: /data1/llx/BigSmallCollab_results/distill
fail_fast: false

pairs:
  - teacher: mirepnet
    student: ifnet
    params: {lam_mmd: 0.5}
    grid: {}
  - teacher: mirepnet
    student: eegnet
    params: {lam_mmd: 0.5}
    grid: {}
  - teacher: mirepnet
    student: adfcnn
    params: {lam_mmd: 0.5}
    grid: {}
  - teacher: cbramod
    student: ifnet
    params: {lam_mmd: 0.5}
    grid: {}
  - teacher: cbramod
    student: eegnet
    params: {lam_mmd: 0.5}
    grid: {}
  - teacher: cbramod
    student: adfcnn
    params: {lam_mmd: 0.5}
    grid: {}
