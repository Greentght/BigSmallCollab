name: distill_kd_mi_proto_mask_warmup10_mirepnet_adfcnn
type: distill
method: kd_mi_proto_mask_warmup10_mirepnet_adfcnn

datasets:
  - BNCI2014001
  - BNCI2014004
  - BNCI2015001
  - AlexMI
protocol: fewshot
val_split: 0.7
seed: 666
teacher: mirepnet
student: adfcnn
artifact_root: results/artifacts
output_dir: results/distill/kd_mi_proto_mask_warmup10/mirepnet__adfcnn
epochs: 100
warmup_epochs: 10
optimizer: adamw
lr: 0.001
weight_decay: 0.01
batch_size: 16
scheduler: CosineAnnealingLR
temperature_kd: 2.0
lam_kd: 0.5
temperature_mi: 1.0
lam_mi: 0.1
mi_eps: 1.0e-8
prototype_epsilon: 1.0e-12
drop_last: false
model_selection: final_epoch
conditions:
  - KD_PROTO
  - MI_PROTO
  - KD_MI_PROTO
main_csv: results/distill/kd_mi_proto_mask_warmup10_mirepnet__adfcnn.csv
