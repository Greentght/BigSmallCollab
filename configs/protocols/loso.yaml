# Current baseline on the refreshed 004/5001 sources.
# Training/preprocessing values live in configs/models; sources live in
# configs/datasets. Artifact IDs are retained so completed runs stay reusable.
protocol_id: loso_source_refresh_004_5001_v1
status: current_baseline
baseline_recipe: source_refreshed_loso_v1
datasets: [BNCI2014004, BNCI2015001]
models: [mirepnet, cbramod, ifnet, eegnet, adfcnn]
model_config_source: configs/models/{model}.yaml::finetune.{dataset}.loso
dataset_config_source: configs/datasets/{dataset}.yaml::loso
seeds: [666, 667, 668]
split: leave_one_subject_out
training_trials: all_selected_session_trials_of_non_test_subjects
test_trials: all_selected_session_trials_of_held_out_subject
validation: none
evaluation: fixed_final_epoch_once
aggregation: subject_equal_mean_per_seed_then_seed_mean_and_sample_std
model_input_window: 1000_samples_at_250_hz
mirepnet_test_ea: entire_unlabeled_held_out_subject_pool
baseline_results: /data1/llx/BigSmallcollab/results/reproductions/loso_source_refresh_004_5001_v1
model_inputs: /data1/llx/BigSmallcollab/cache/reproductions/loso_source_refresh_004_5001_v1/model_inputs
distillation_config: configs/experiments/loso_distillation.yaml
execution:
  baseline_worker: experiments/finetune/run_loso_source_refresh_004_5001.py
  input_preparation: experiments/finetune/prepare_loso_source_refresh_004_5001.py
  distillation_dispatcher: experiments/distill/dispatch_loso_source_refresh_distillation.py
  allowed_physical_gpus: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  prohibited_physical_gpus: [0]
