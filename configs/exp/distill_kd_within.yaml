# Within-subject distillation: MIRepNet teacher -> IFNet student, KD ablation.
# Run in the student's env (mirepnet). Teacher artifacts must be exported first:
#   conda run -n mirepnet python scripts/finetune_export.py --model mirepnet --dataset <ds>
# Then:
#   conda run -n mirepnet python -m experiments.run configs/exp/distill_kd_within.yaml --report
name: distill_kd_within
protocol: within
datasets: [BNCI2014004]
teacher: mirepnet
student: ifnet
seeds: null            # null -> dataset config default [666, 667, 668]
units: null            # null -> all subjects

distill:               # shared distill_student hyperparameters
  temperature: 2.0
  epochs: 50
  lr: 0.001
  weight_decay: 0.01
  batch_size: 16

conditions:            # name -> {method [, masked] [, overrides]}
  base:      {method: baseline}
  KD:        {method: kd,    lam_kd: 0.5}
  KD_masked: {method: kd,    lam_kd: 0.5, masked: true}
  Combo:     {method: combo, lam_kd: 0.5, lam_feat: 0.5}

report:
  baseline: ifnet_base
  metrics: [acc, kappa]
