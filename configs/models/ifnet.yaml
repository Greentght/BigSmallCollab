# IFNet small specialist (B,C,T). Env: mirepnet.
env: mirepnet
size: small

# Model-specific finetune hyperparameters.
# Merge order: defaults < dataset < protocol. Data splits/seeds stay in configs/datasets/.
finetune:
  defaults:
    epochs: 100
    lr: 0.001
    batch_size: 16
    weight_decay: 0.01
    use_filter_bank: True
  BNCI2014001:
    fewshot:
      epochs: 100
      lr: 0.001
      batch_size: 16
      weight_decay: 0.01
    loso:
      epochs: 100
      lr: 0.001
      batch_size: 16
      weight_decay: 0.01
      optimizer: adamw
      lr_schedule: epoch_cosine
      schedule_update: epoch_end
      duration_seconds: 4.0
      sample_rate: 250
      samples: 1000
      skip_preprocess: false
      use_filter_bank: true
      filter_bank_hz:
      - - 4.0
        - 16.0
      - - 16.0
        - 40.0
  BNCI2014001-4:
    fewshot:
