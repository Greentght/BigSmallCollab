# LaBraM Base with EEG-FM-Benchmark default fine-tuning settings.
# The framework keeps its broadband sources and dataset-specific split protocol.
env: labram
size: big

finetune:
  defaults:
    epochs: 20
    lr: 0.001
    batch_size: 16
    weight_decay: 0.01
    scale: 100
    readout: flatten
    dropout_rate: 0.5
    label_smoothing: 0.0
    layer_decay: 1.0
    warmup_epochs: 5
    min_lr: 0.000001
    use_grad_clipping: false
  BNCI2014001: {fewshot: {}, loso: {}}
  BNCI2014001-4: {fewshot: {}, loso: {}}
  BNCI2014004: {fewshot: {}, loso: {}}
  BNCI2015001: {fewshot: {}, loso: {}}
  AlexMI: {fewshot: {}, loso: {}}

# pretrain: defaults to /data1/llx/pre_weight/labram-base.pth
