# ADFCNN small specialist (B,1,C,T internally). Env: mirepnet.
env: mirepnet
size: small

# Model-specific finetune hyperparameters.
# Merge order: defaults < dataset < protocol. Data splits/seeds stay in configs/datasets/.
finetune:
  defaults:
    epochs: 100
    lr: 0.001
    batch_size: 32
    weight_decay: 0.0001
  BNCI2014001:
    fewshot:
      epochs: 100
      lr: 0.001
      batch_size: 32
      weight_decay: 0.0001
    loso:
      epochs: 100
      lr: 0.001
      batch_size: 32
      weight_decay: 0.0001
  BNCI2014001-4:
