# ADFCNN small specialist (B,1,C,T internally). Env: mirepnet.
env: mirepnet
size: small

# Model-specific finetune hyperparameters.
# Merge order: defaults < dataset < protocol. Data splits/seeds stay in configs/datasets/.
finetune:
  defaults:
    epochs: 100
    lr: 0.001
    batch_size: 32
    weight_decay: 0.0001
  BNCI2014001:
    fewshot:
      epochs: 100
      lr: 0.001
      batch_size: 32
      weight_decay: 0.0001
    loso:
      epochs: 100
      lr: 0.001
      batch_size: 32
      weight_decay: 0.0001
      optimizer: adamw
      lr_schedule: epoch_cosine
      schedule_update: epoch_end
      duration_seconds: 4.0
      sample_rate: 250
      samples: 1000
      skip_preprocess: false
      l_freq: 8.0
      h_freq: 32.0
      filter_order: 4
      filter_phase: zero_phase
      preprocessing_stage: cached_input
  BNCI2014001-4:
    fewshot:
      epochs: 100
      lr: 0.001
      batch_size: 32
      weight_decay: 0.0001
