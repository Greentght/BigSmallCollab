      feature_head: flatten
      warmup_epochs: 5
      min_lr: 1.0e-06
      lr_schedule: reference_step_table
      schedule_update: epoch_end_global_step_table
      class_weights: false
      duration_seconds: 4.0
      sample_rate: 250
      samples: 1000
      skip_preprocess: true
  BNCI2014004:
    fewshot:
      epochs: 20
      lr: 0.001
      batch_size: 16
      weight_decay: 0.01
      dropout: 0.5
      scale: 1
      label_smoothing: 0.0
      target_fs: 200
      l_freq: 0.3
      h_freq: 75.0
      notch_freq: 60.0
      apply_EA: false
      warmup_epochs: 5
      min_lr: 0.000001
    loso:
      epochs: 50
